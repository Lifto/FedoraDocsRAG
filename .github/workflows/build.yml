name: Build Fedora Docs

on:
  schedule:
    - cron: '22 6 * * *'  # Daily at 06:22 UTC
  workflow_dispatch:       # Manual trigger
    inputs:
      force:
        description: 'Force full rebuild (ignore manifest)'
        type: boolean
        default: false

concurrency:
  group: fedora-docs-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Restore docs content cache
        uses: actions/cache@v4
        with:
          path: |
            .docs2db
            docs2db_content
          key: docs-content-${{ hashFiles('build.py') }}
          restore-keys: |
            docs-content-

      - name: Restore HuggingFace model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-model-granite-30m

      - name: Ensure Docker is used
        run: sudo rm -f /usr/bin/podman

      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17

      - name: Build Fedora docs
        run: uv run python build.py ${{ inputs.force == 'true' && '--force' || '' }}

      - name: Set release date
        if: hashFiles('dist/fedora-docs.sql') != ''
        run: echo "RELEASE_DATE=$(date +%Y.%m.%d)" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        if: hashFiles('dist/fedora-docs.sql') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RELEASE_DATE }}
          name: Fedora Docs ${{ env.RELEASE_DATE }}
          body: "Daily automated rebuild of Fedora documentation database."
          files: |
            dist/fedora-docs.sql
            dist/manifest.json
          make_latest: true

      - name: Upload manifest to latest release
        if: hashFiles('dist/manifest.json') != '' && hashFiles('dist/fedora-docs.sql') == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --json tagName -q .tagName 2>/dev/null)
          if [ -n "$tag" ]; then
            gh release upload "$tag" dist/manifest.json --clobber
            echo "Uploaded manifest.json to release $tag"
          else
            echo "No existing release found, skipping manifest upload"
          fi
