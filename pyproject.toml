[project]
name = "fedora-docs-rag"
version = "1.3.0"
description = "Pre-built RAG database of Fedora documentation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
authors = [
    { name = "Ellis Low", email = "lifto@mac.com" }
]
keywords = ["fedora", "documentation", "rag", "ai", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Documentation",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "beautifulsoup4>=4.12.0",
    "docs2db>=0.1.0",
    "docs2db-api>=0.1.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/Lifto/FedoraDocsRAG"
Repository = "https://github.com/Lifto/FedoraDocsRAG"
Issues = "https://github.com/Lifto/FedoraDocsRAG/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "W",      # pycodestyle warnings
    "I",      # isort
    "UP",     # pyupgrade
    "S",      # bandit (security)
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "TID252", # flake8-tidy-imports (relative imports)
    "RUF100", # flag unnecessary noqa comments
]
ignore = [
    "B9",     # flake8-bugbear opinionated rules (B901-B911)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104"]

[tool.ruff.lint.isort]
case-sensitive = false
force-single-line = true
lines-after-imports = 2
lines-between-types = 1
order-by-type = false

[dependency-groups]
dev = [
    "ruff>=0.15.13",
]


